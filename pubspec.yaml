name: eway
description: DIGILYZR eWay — pharmaceutical sales-force automation app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.1

  # Local database (offline-first) + encryption
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  # sqlcipher_flutter_libs: ^0.6.4   # enable when wiring DB encryption
  path_provider: ^2.1.5
  path: ^1.9.0

  # Secure storage (tokens) + biometrics
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Preferences (theme, non-sensitive settings)
  shared_preferences: ^2.3.3

  # Connectivity (drives offline/sync state)
  connectivity_plus: ^6.1.0

  # Charts (free, covers the whole approved design)
  fl_chart: ^0.69.2

  # Models / serialisation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI helpers
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Functional error handling
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Codegen
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.20.3
  # retrofit_generator is intentionally absent: the version that resolves
  # against retrofit 4.9.2 fails to compile the build script, and nothing
  # uses Retrofit annotations yet (the remote datasources are plain Dio).
  # Add it back — with both versions pinned together — when the real API
  # arrives and the Retrofit interfaces are written.

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Inter is bundled rather than fetched at runtime. google_fonts resolves
    # these by filename, so the app never needs the network for its type —
    # required for the offline-first brief (report §5).
    - assets/google_fonts/
